main{position:relative;z-index:1;max-width:1280px;margin:0 auto;padding:20px 18px 60px}
header{text-align:center;margin-bottom:18px}
.script{font-family:cursive;font-weight:800;font-size:clamp(28px,3vw,42px);color:#fff;letter-spacing:1px;transform:rotate(-2deg)}
.brand{display:inline-flex;gap:.04em;align-items:flex-end;justify-content:center;line-height:1;margin:8px 0 10px;font-family:"Arial Black","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:clamp(54px,7vw,98px);font-weight:1000;letter-spacing:-.08em;text-shadow:3px 5px 0 rgba(53,25,0,.35)}
.brand span{display:inline-block}
.brand .o{color:var(--orange);transform:rotate(-2deg) scaleY(1.03)}
.brand .y{color:var(--yellow);transform:rotate(1deg) scaleY(1.02)}
header p{margin:0;color:#f8f0ff;font-size:14px}
.layout{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(320px,.92fr);gap:18px;align-items:start}
.panel{background:var(--panel);color:var(--ink);border:3px solid var(--line);border-radius:26px;padding:20px;box-shadow:0 10px 0 rgba(0,0,0,.12)}
.panel h2{margin:0 0 14px;color:#5f56a5;font-size:22px}
.panel h3{margin:16px 0 10px;color:#51478a;font-size:16px}
.panel-card{background:#fffdf8;border:2px dashed #ecd8b8;border-radius:16px;padding:14px}
.camera-wrap{position:relative;max-width:680px;margin:auto;aspect-ratio:4/3;background:#42585a;border:3px solid #e5bf64;border-radius:18px;overflow:hidden;display:grid;place-items:center}
.camera-wrap video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.camera-placeholder{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:20px;background:linear-gradient(135deg,#556b6f,#334548);color:#fffbe7;font-weight:800;font-size:20px}
.camera-placeholder small{display:block;margin-top:10px;font-size:13px;font-weight:500}
.countdown{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,8,24,.55);font-size:clamp(90px,18vw,190px);font-weight:1000;color:#ffd650;text-shadow:7px 9px 0 #f2752a;z-index:3}
.hidden{display:none!important}
.status{margin:12px 0;padding:12px 14px;border-radius:12px;background:#efe7d8;color:#5a5261;min-height:46px;font-size:13px;line-height:1.55}
.status[data-type=error]{background:#ffe2df;color:#a23731}
.status[data-type=success]{background:#dcf4e5;color:#136e4d}
.buttons{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.capture-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;flex-wrap:nowrap}.capture-actions .btn{min-width:0;width:100%;padding:12px 5px;white-space:nowrap;font-size:clamp(10px,1.35vw,15px)}
.btn{border:0;border-radius:14px;padding:13px 16px;min-height:48px;font-weight:900;box-shadow:0 4px 0 rgba(0,0,0,.12);background:#ece5f2;color:#40364f}
.btn.primary{background:#f6b367}.btn.yellow{background:#ffd95c}.btn.green{background:#c7ead8}.btn.pink{background:#f4ccd7}.btn.blue{background:#cbe7f7}.btn:focus-visible,.thumb:focus-visible,.sticker-option:focus-visible{outline:3px solid #8356d8;outline-offset:3px}
.file-label{display:inline-flex;align-items:center;justify-content:center} .file-label input{display:none}
.small-note{font-size:12px;color:#6d6677;line-height:1.6}
.progress{font-weight:900;background:#e5f4ee;color:#248063;padding:9px 12px;border-radius:999px;display:inline-block;font-size:13px}
.slotbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}

.preview-shell{display:flex;justify-content:center;padding:12px;background:#f4ecdd;border-radius:18px}
.preview-canvas{width:min(100%,460px);height:auto;display:block;border-radius:14px;box-shadow:0 8px 24px rgba(23,18,43,.2);touch-action:none;background:#071e40}
.hint{text-align:center;font-size:12px;color:#746c7b;line-height:1.55;margin:10px 0}
.info-chip{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;background:#fff3d9;color:#5e4c2f;font-weight:800;font-size:12px}
.stickers{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.sticker-option{border:1px solid #e6dacb;background:#fff;border-radius:12px;font-size:25px;min-height:44px;padding:4px}
.sticker-option:hover{background:#fff2cb}
.edit-control{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.edit-control input{flex:1;min-width:80px;accent-color:#8e62b7}
.field{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px} .field input[type=checkbox]{width:19px;height:19px;accent-color:#956bc1}
.result-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px} .result-actions .btn:last-child{grid-column:1/-1}
.stage-content[hidden]{display:none}
.notice{font-size:12px;color:#5b5367;line-height:1.65}
@media(max-width:820px){main{padding:16px 12px 84px} .layout{grid-template-columns:1fr} .panel{padding:16px} .preview-canvas{width:min(100%,540px)} .buttons .btn{flex:1} .capture-actions .btn{flex:initial;font-size:clamp(10px,2.7vw,14px)} }
@media(max-width:430px){.step{font-size:11px;padding:8px 11px} .stickers{grid-template-columns:repeat(4,1fr)} .brand{font-size:clamp(48px,13vw,72px)}}
</style>
</head>
<body>
<div class="sparkle-background" aria-hidden="true"></div>
<main>
  <header>
    
    <h1 class="brand"><span class="o">해</span><span class="y">솔</span><span class="o">네</span><span class="y">컷</span></h1>
    
  </header>
  <div class="layout">
    <section class="panel">
      <div id="capturePane" class="stage-content">
        <div class="slotbar"><h2>📸 카메라</h2><span id="photoCount" class="progress">0 / 4 촬영</span></div>
        <div class="camera-wrap">
          <video id="video" autoplay muted playsinline></video>
          <div id="cameraPlaceholder" class="camera-placeholder">👻<div>카메라를 시작해 주세요</div></div>
          <div id="countdown" class="countdown hidden" aria-live="assertive">3</div>
        </div>
        <div class="buttons capture-actions">
          <button class="btn primary" id="startCamera">📷 카메라 시작</button>
          <button class="btn yellow" id="takePhoto" disabled>✨ 촬영하기 (3초)</button>
          
          <button class="btn green" id="toEdit" disabled>🎨 꾸미러 가기 →</button>
        </div>
      </div>
      <div id="editPane" class="stage-content" hidden>
        <h2>🎨 사진 꾸미기</h2>
        <h3>프레임 제목</h3>
        <label class="field"><input type="checkbox" id="showTitle" checked> 상단에 ‘해솔네컷’ 제목 표시</label>
        <h3>할로윈 스티커 <span class="small-note">(눌러서 추가)</span></h3>
        <div class="stickers" id="stickers"></div>
        
        <div class="edit-control">
          <label class="field" for="stickerSize">선택한 스티커 크기</label>
          <input type="range" id="stickerSize" min="35" max="220" value="100" disabled>
          <span id="sizeNumber">100%</span>
        </div>
        <div class="buttons">
          <button class="btn pink" id="deleteSticker" disabled>🗑️ 선택 스티커 삭제</button>
          <button class="btn yellow" id="clearStickers">♻️ 스티커 모두 지우기</button>
        </div>
        <div class="buttons">
          <button class="btn" id="backCapture">← 촬영 화면으로</button>
          <button class="btn green" id="toResult">완성 보기 →</button>
        </div>
      </div>
      <div id="resultPane" class="stage-content" hidden>
        <h2>🎉 완성된 해솔네컷</h2>
        
        <div class="result-actions">
          <button class="btn blue" id="backEdit">🎨 다시 꾸미기</button>
          <button class="btn pink" id="reset">🔄 처음부터 다시 하기</button>
          <button class="btn primary" id="download">💾 이미지 저장하기</button>
        </div>
      </div>
      <div id="status" class="status" aria-live="polite">카메라를 시작해 사진 4장을 촬영해 주세요.</div>
    </section>

    <aside class="panel">
      <div class="slotbar"><h2>🖼️ 프레임 미리보기</h2><span id="previewCount" class="progress">0 / 4</span></div>
      <div class="preview-shell"><canvas id="preview" class="preview-canvas" width="1200" height="1480"></canvas></div>
    </aside>
  </div>
</main>
<script>

  const canvas = $('#preview');

  function roundRect(x,y,w,h,r,fill,stroke) {
    ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);

    ctx.font = font.replace('40px', size+'px');
    ctx.fillText(txt,x,y);

  function imageCover(img,x,y,w,h) {
    const iw = img.naturalWidth || img.width;
    const ih = img.naturalHeight || img.height;
    if(!iw || !ih) return;
    const scale = Math.max(w/iw, h/ih);
    const dw = iw * scale, dh = ih * scale;
    ctx.drawImage(img, x + (w-dw)/2, y + (h-dh)/2, dw, dh);
  }

      {t:'솔',x:525,y:176,c:'#ffd24b',r:0.01,sx:1.06},
      {t:'네',x:660,y:171,c:'#ff8928',r:-0.01,sx:1.00},
      {t:'컷',x:780,y:179,c:'#ffd24b',r:0.02,sx:1.04}
    ];
    for(const item of letters) {
      ctx.save();
      ctx.translate(item.x, item.y);
      ctx.rotate(item.r);
      ctx.scale(item.sx, 1.02);
      ctx.font = '900 104px "Arial Black","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.strokeText(item.t, 0, 0);
      ctx.fillStyle = item.c;
      ctx.fillText(item.t, 0, 0);
      ctx.restore();
    }
    ctx.restore();
  }

  function drawFrameFallback() {
    ctx.fillStyle = '#041a3a';
    ctx.fillRect(0,0,W,H);
    // moon
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(985, 84, 38, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#041a3a'; ctx.beginPath(); ctx.arc(1000, 74, 36, 0, Math.PI*2); ctx.fill();
    // stars
    const stars = [[905,36],[878,72],[920,69],[140,120],[1060,188]];
    ctx.fillStyle = '#fff';
    for(const [sx,sy] of stars) { ctx.beginPath(); ctx.arc(sx,sy,4,0,Math.PI*2); ctx.fill(); }
    // webs and bottom pumpkin/ghost simplified
    ctx.strokeStyle='#fff'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(190,0); ctx.lineTo(190,120); ctx.stroke();
    drawRuggedTitle();
  }

  function render() {
    ctx.clearRect(0,0,W,H);
    if(frameImg.complete && frameImg.naturalWidth) {
      ctx.fillStyle='#0a192c'; ctx.fillRect(0,0,W,H);
      // Keep the original artwork at its natural size in the header.
      ctx.drawImage(frameImg,0,0,1200,268,0,0,1200,268);
      // Reposition the original pumpkin-and-ghost artwork to the footer.
      ctx.drawImage(frameImg,0,517,1200,400,0,1080,1200,400);
    } else drawFrameFallback();
    // 참고 프레임에 포함된 상단 영문 문구는 표시하지 않습니다.
    ctx.fillStyle = '#0a192e'; ctx.fillRect(428, 12, 346, 77);
    if(showTitle) drawRuggedTitle();
    else { ctx.fillStyle = '#031a3a'; ctx.fillRect(312, 76, 575, 135); }

    for(let i=0;i<4;i++) {
      const s = slots[i];
      ctx.save();
      ctx.shadowColor = 'rgba(0,0,0,.22)'; ctx.shadowBlur = 10; ctx.shadowOffsetY = 6;
      roundRect(s.x-10,s.y-10,s.w+20,s.h+20,24,'rgba(255,248,236,.92)');
      ctx.restore();
      ctx.save();
      ctx.lineWidth = 8;
      roundRect(s.x-2,s.y-2,s.w+4,s.h+4,20,null,accentColors[i]);
      roundRect(s.x,s.y,s.w,s.h,18,'#fff8ef');
      ctx.beginPath(); roundRect(s.x,s.y,s.w,s.h,18); ctx.clip();
      if(photos[i]) imageCover(photos[i], s.x, s.y, s.w, s.h);
      else {
        ctx.fillStyle = '#fff8ef'; ctx.fillRect(s.x,s.y,s.w,s.h);
        drawText(['👻','🎃','🦇','🍬'][i], s.x+s.w/2, s.y+s.h/2-18, 62, '#8152b1');
        drawText(`${i+1}번째 사진`, s.x+s.w/2, s.y+s.h/2+42, 24, '#7b7381');
      }
      ctx.restore();
      ctx.save(); roundRect(s.x+12,s.y+12,40,40,20,'rgba(255,247,222,.95)'); ctx.restore();
      drawText(String(i+1), s.x+32, s.y+32, 22, '#403650');
    }

    for(let i=0;i<stickers.length;i++) {
      const s = stickers[i];
      ctx.save();
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.font=`${s.size}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
      ctx.fillText(s.emoji,s.x,s.y);
      ctx.restore();
      if(stage === 'edit' && selectedSticker === i) {
        ctx.save();
        ctx.setLineDash([8,7]); ctx.lineWidth=3; ctx.strokeStyle='#5f26b4';
        ctx.strokeRect(s.x-s.size*.58, s.y-s.size*.64, s.size*1.16, s.size*1.28);
        ctx.restore();
      }
    }

    $('#previewCount').textContent = photos.filter(Boolean).length + ' / 4';
  }

  function updateThumbs() {
    const count = photos.filter(Boolean).length;
    $('#photoCount').textContent = `${count} / 4 촬영`;
    $('#toEdit').disabled = count !== 4;
  }

  function nextSlot() { return photos.findIndex(p => !p); }

  function assignPhoto(img) {
    const index = nextSlot();
    if(index < 0) { status('4컷이 모두 채워졌어요. 꾸미기로 이동하거나 처음부터 다시 시작해 주세요.', 'error'); return false; }
    photos[index] = img;
    updateThumbs();
    render();
    const count = photos.filter(Boolean).length;
    status(`${index+1}번째 사진이 저장되었어요. 현재 ${count}/4컷입니다.${count===4?' 이제 꾸미러 가세요!':''}`, 'success');
    return true;
  }

  async function startCamera() {
    if(!navigator.mediaDevices?.getUserMedia) {
      status('이 브라우저에서는 카메라를 사용할 수 없어요. HTTPS 또는 localhost에서 실행해 주세요.', 'error');
      return;
    }
    try {
      status('카메라 연결 중…');
      $('#startCamera').disabled = true;
      if(stream) stream.getTracks().forEach(t => t.stop());
      stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:960}},audio:false});
      video.srcObject = stream;
      await video.play();
      cameraReady = true;
      $('#cameraPlaceholder').classList.add('hidden');
      $('#takePhoto').disabled = false;
      $('#startCamera').textContent = '🔄 카메라 다시 연결';
      updateThumbs();
      status('카메라 준비 완료! 촬영하기를 누르면 3초 후 사진을 찍습니다.', 'success');
      stream.getVideoTracks()[0]?.addEventListener('ended', () => {
        cameraReady = false;
        $('#takePhoto').disabled = true;
        $('#cameraPlaceholder').classList.remove('hidden');
        status('카메라 연결이 종료되었어요.', 'error');
      });
    } catch(err) {
      cameraReady = false;
      $('#cameraPlaceholder').classList.remove('hidden');
      const denied = err?.name === 'NotAllowedError' || err?.name === 'PermissionDeniedError';
      status(denied ? '카메라 권한이 거부되었어요. 브라우저 설정에서 권한을 허용해 주세요.' : '카메라 연결에 실패했어요. 다른 앱에서 카메라를 사용 중인지 확인해 주세요.', 'error');
    } finally {
      $('#startCamera').disabled = false;
    }
  }

  const delay = ms => new Promise(r => setTimeout(r, ms));
  async function takePhoto() {
    if(!cameraReady || isCounting) return;
    const index = nextSlot();
    if(index < 0) { status('교체할 칸을 먼저 선택하거나 비어 있는 칸을 사용해 주세요.', 'error'); return; }
    isCounting = true;
    $('#takePhoto').disabled = true;
    try {
      for(let n=3;n>=1;n--) {
        $('#countdown').textContent = n;
        $('#countdown').classList.remove('hidden');
        status(`${index+1}번째 사진을 ${n}초 후 촬영합니다.`);
        await delay(1000);
      }
      $('#countdown').textContent = '📸';
      const temp = document.createElement('canvas');
      temp.width = 900; temp.height = 1000;
      const c = temp.getContext('2d');
      c.translate(temp.width,0); c.scale(-1,1);
      const vw = video.videoWidth, vh = video.videoHeight;
      if(!vw || !vh) throw new Error('카메라 영상이 준비되지 않았습니다.');
      const scale = Math.max(temp.width/vw, temp.height/vh);
      const sw = temp.width/scale, sh = temp.height/scale;
      c.drawImage(video, (vw-sw)/2, (vh-sh)/2, sw, sh, 0, 0, temp.width, temp.height);
      const img = new Image();
      img.src = temp.toDataURL('image/jpeg', .95);
      await img.decode();
      assignPhoto(img);
    } catch(err) {
      status('촬영에 실패했어요. 카메라 연결 상태를 확인하고 다시 시도해 주세요.', 'error');
    } finally {
      isCounting = false;
      $('#countdown').classList.add('hidden');
      $('#takePhoto').disabled = !cameraReady;
      updateThumbs();
    }
  }

  function setStickerSelection(i) {
    selectedSticker = (i >= 0 && stickers[i]) ? i : -1;
    const sticker = stickers[selectedSticker];
    $('#stickerSize').disabled = !sticker;
    $('#deleteSticker').disabled = !sticker;
    $('#stickerSize').value = sticker ? Math.round(sticker.size/115*100) : 100;
    $('#sizeNumber').textContent = sticker ? Math.round(sticker.size/115*100)+'%' : '100%';
    render();
  }
  function addSticker(emoji) {
    const sticker = {emoji, x: W/2, y: H/2, size: 115};
    stickers.push(sticker);
    setStickerSelection(stickers.length - 1);
    status('스티커를 추가했어요. 미리보기에서 드래그해 위치를 옮겨 보세요.', 'success');
  }
  function localPoint(e) {
    const rect = canvas.getBoundingClientRect();
    return {x:(e.clientX-rect.left)*W/rect.width, y:(e.clientY-rect.top)*H/rect.height};
  }
  function clampSticker(s) {
    const mx = s.size * .38; const my = s.size * .42;
    s.x = Math.max(mx, Math.min(W - mx, s.x));
    s.y = Math.max(my, Math.min(H - my, s.y));
  }

  canvas.addEventListener('pointerdown', e => {
    if(stage !== 'edit') return;
    const p = localPoint(e);
    for(let i=stickers.length-1;i>=0;i--) {
      const s = stickers[i];
      if(Math.abs(s.x-p.x) < s.size*.67 && Math.abs(s.y-p.y) < s.size*.74) {
        setStickerSelection(i);
        pointer = {id:e.pointerId, dx:p.x-s.x, dy:p.y-s.y};
        canvas.setPointerCapture(e.pointerId);
        return;
      }
    }
    setStickerSelection(-1);
  });
  canvas.addEventListener('pointermove', e => {
    if(!pointer || pointer.id !== e.pointerId || selectedSticker < 0) return;
    const p = localPoint(e);
    const s = stickers[selectedSticker];
    s.x = p.x - pointer.dx; s.y = p.y - pointer.dy;
    clampSticker(s); render();
  });
  const release = () => { pointer = null; };
  canvas.addEventListener('pointerup', release); canvas.addEventListener('pointercancel', release);

  function reset() {
    photos = [null,null,null,null];
    stickers = [];
    setStickerSelection(-1);
    updateThumbs();
    setStage('capture');
    status('새로운 해솔네컷을 시작해요! 카메라로 4장을 촬영해 주세요.', 'success');
  }

  $('#startCamera').onclick = startCamera;
  $('#takePhoto').onclick = takePhoto;
  $('#toEdit').onclick = () => { if(photos.every(Boolean)) { updateThumbs(); setStage('edit'); status('새 프레임 위에 스티커를 올려 꾸며 보세요.', 'success'); } };
  $('#backCapture').onclick = () => setStage('capture');
  $('#toResult').onclick = () => { setStickerSelection(-1); setStage('result'); status('완성된 해솔네컷이에요! 저장 버튼으로 PNG를 내려받을 수 있어요.', 'success'); };
  $('#backEdit').onclick = () => { setStage('edit'); status('다시 꾸미기 모드로 돌아왔어요.'); };
  $('#reset').onclick = reset;
  $('#download').onclick = () => {
    try {
      render();
      canvas.toBlob(blob => {
        if(!blob) { status('이미지 생성에 실패했어요. 다시 시도해 주세요.', 'error'); return; }
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = '해솔네컷_할로윈_' + new Date().toISOString().slice(0,10) + '.png';
        document.body.append(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 30000);
        status('🎉 PNG 저장을 시작했어요! 다운로드 폴더를 확인해 주세요.', 'success');
      }, 'image/png');
    } catch(err) {
      status('이미지 저장에 실패했어요. 다시 시도해 주세요.', 'error');
    }
  };
  $('#showTitle').onchange = e => { showTitle = e.target.checked; render(); };
  $('#stickerSize').oninput = e => {
    if(selectedSticker < 0) return;
    stickers[selectedSticker].size = 115 * Number(e.target.value) / 100;
    clampSticker(stickers[selectedSticker]);
    $('#sizeNumber').textContent = e.target.value + '%';
    render();
  };
  $('#deleteSticker').onclick = () => {
    if(selectedSticker < 0) return;
    stickers.splice(selectedSticker, 1);
    setStickerSelection(-1);
    status('선택한 스티커를 삭제했어요.');
  };
  $('#clearStickers').onclick = () => {
    stickers = []; setStickerSelection(-1); status('모든 스티커를 삭제했어요.');
  };

  for(const emoji of emojis) {
    const btn = document.createElement('button');
    btn.className = 'sticker-option';
    btn.type = 'button';
    btn.textContent = emoji;
    btn.title = `${emoji} 스티커 추가`;
    btn.setAttribute('aria-label', `${emoji} 스티커 추가`);
    btn.onclick = () => addSticker(emoji);
    $('#stickers').append(btn);
  }

  frameImg.onload = () => render();
  updateThumbs();
  render();
  window.addEventListener('beforeunload', () => stream?.getTracks().forEach(t => t.stop()));
})();
</script>
</body>
</html>
